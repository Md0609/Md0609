name: Generar skyline

on:
  # Se regenera cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # Botón "Run workflow" en la pestaña Actions
  workflow_dispatch:
  # Se vuelve a generar si cambia este workflow o el script
  push:
    branches: [main]
    paths:
      - ".github/workflows/skyline.yml"
      - ".github/scripts/skyline.py"

permissions:
  contents: write

concurrency:
  group: skyline
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generar el SVG con las contribuciones
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/skyline.py dist/github-skyline.svg

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
