name: Generar serpiente

on:
  # Se regenera cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # Botón "Run workflow" en la pestaña Actions
  workflow_dispatch:
  # Se vuelve a generar si cambia este workflow o el script de estilo
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - ".github/scripts/style_snake.py"

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generar SVG de la serpiente
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark

      - name: Aplicar estilo terminal
        run: python3 .github/scripts/style_snake.py dist/github-snake.svg

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
