name: Generar serpiente

on:
  # Se regenera cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # Botón "Run workflow" en la pestaña Actions
  workflow_dispatch:
  # Primera ejecución automática al subir este fichero
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar SVG de la serpiente
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=green
            dist/github-snake-dark.svg?palette=github-dark&color_snake=lime

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
