<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="6" viewBox="0 0 1000 6" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#58a6ff"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="6" rx="3" fill="url(#g)" opacity=".85"/>
</svg>
