<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="4" viewBox="0 0 1000 4" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff66" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ff66"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="1000" height="4" rx="2"/></clipPath>
    <style>
      .p { animation: run 4s linear infinite; }
      @keyframes run { from { transform: translateX(-300px); } to { transform: translateX(1000px); } }
      @media (prefers-reduced-motion: reduce) { .p { animation: none; transform: translateX(350px); } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="4" fill="#1c3326"/>
    <rect class="p" width="300" height="4" fill="url(#pulse)"/>
  </g>
</svg>
