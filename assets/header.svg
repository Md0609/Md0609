<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="t d">
  <title id="t">Matias Dios</title>
  <desc id="d">Desarrollador en formación. Estudiante de DAM, formado en 42 Madrid. C, C++, TypeScript e IA.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027">
        <animate attributeName="stop-color" values="#0f2027;#14303c;#0f2027" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364">
        <animate attributeName="stop-color" values="#2c5364;#245a6e;#2c5364" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="240" rx="16"/></clipPath>

    <style>
      .name   { font: 700 58px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; animation: rise 1s ease-out both; }
      .tag    { font: 500 17px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #b6c9d3; letter-spacing: 3px; animation: rise 1s .25s ease-out both; }
      .role   { font: 500 20px 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; opacity: 0; animation: cycle 12s infinite; }
      .r2     { animation-delay: 3s; }
      .r3     { animation-delay: 6s; }
      .r4     { animation-delay: 9s; }
      .bar    { transform-origin: 60px 128px; animation: grow 1.2s .4s ease-out both; }
      .sym    { font: 500 30px 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #ffffff; opacity: .12; }
      .f1     { animation: float 7s ease-in-out infinite; }
      .f2     { animation: float 9s ease-in-out -2s infinite; }
      .f3     { animation: float 8s ease-in-out -4s infinite; }
      .f4     { animation: float 10s ease-in-out -6s infinite; }
      .cursor { animation: blink 1s steps(1) infinite; }

      @keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes cycle {
        0%   { opacity: 0; transform: translateY(8px); }
        3%   { opacity: 1; transform: none; }
        22%  { opacity: 1; transform: none; }
        25%  { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .r1 { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="240" fill="url(#bg)"/>

    <!-- símbolos de código flotando -->
    <text class="sym f1" x="800" y="70">&lt;/&gt;</text>
    <text class="sym f2" x="900" y="120">{ }</text>
    <text class="sym f3" x="820" y="215">;</text>
    <text class="sym f4" x="920" y="200">01</text>
    <text class="sym f2" x="700" y="40">#</text>
    <text class="sym f3" x="640" y="215">( )</text>

    <!-- contenido -->
    <text class="tag" x="60" y="54">DESARROLLADOR EN FORMACIÓN</text>
    <text class="name" x="60" y="115">Matias Dios</text>
    <rect class="bar" x="60" y="128" width="150" height="4" rx="2" fill="url(#accent)"/>

    <g fill="url(#accent)">
      <text class="role r1" x="60" y="178">&gt; Estudiante de Desarrollo de Aplicaciones Multiplataforma</text>
      <text class="role r2" x="60" y="178">&gt; Formado en la metodología de 42 Madrid</text>
      <text class="role r3" x="60" y="178">&gt; C · C++ · TypeScript</text>
      <text class="role r4" x="60" y="178">&gt; Construyendo proyectos con IA</text>
    </g>
    <rect class="cursor" x="60" y="196" width="12" height="3" fill="#7ee787"/>
  </g>
</svg>
